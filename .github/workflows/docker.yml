name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  version:
    name: "Version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      adminerevo: ${{ steps.version.outputs.adminerevo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read VERSION and ADMINEREVO_VERSION
        id: version
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "adminerevo=$(sed -n 's/^ENV ADMINEREVO_VERSION=//p' adminerevo/Dockerfile)" >> "$GITHUB_OUTPUT"

  build:
    name: "Build"
    needs: version
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
        image: "dockette/adminerevo"
        tag: "${{ matrix.item }}"
        context: "${{ matrix.context }}"
    strategy:
      matrix:
        include:
          - { item: latest, context: adminerevo }
          - { item: "${{ needs.version.outputs.version }}", context: adminerevo }
          - { item: "${{ needs.version.outputs.adminerevo }}", context: adminerevo }
          - { item: "${{ needs.version.outputs.adminerevo }}-${{ needs.version.outputs.version }}", context: adminerevo }

      fail-fast: false

  release:
    name: "Release"
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat VERSION)"
          u="$(sed -n 's/^ENV ADMINEREVO_VERSION=//p' adminerevo/Dockerfile)"
          gh release view "$v" || gh release create "$v" --title "$v (AdminerEvo $u)" --generate-notes

  docs:
    name: "Docs"
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/adminerevo"
