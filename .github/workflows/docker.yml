name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for testing
        uses: docker/build-push-action@v7
        with:
          context: adminerevo
          file: adminerevo/Dockerfile
          push: false
          tags: dockette/adminerevo:latest-test
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Test Adminerevo UI
        run: |
          docker run --rm -d --name adminerevo-test -p 8080:8080 dockette/adminerevo:latest-test
          sleep 3
          curl -fsS http://localhost:8080/ > /dev/null
          echo "Adminerevo UI OK"

      - name: Cleanup
        if: always()
        run: docker stop adminerevo-test || true

  build:
    name: "Build"
    needs: test
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/adminerevo"
      tag: "${{ matrix.item }}"
      context: "${{ matrix.context }}"
      push: ${{ github.ref == 'refs/heads/master' }}
    strategy:
      matrix:
        include:
          - { item: latest, context: adminerevo }

      fail-fast: false

  docs:
    name: "Docs"
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/master' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dockette/adminerevo
